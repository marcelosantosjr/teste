- name: Criar diretório base da stack
  ansible.builtin.file:
    path: "{{ app_base_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Renderizar docker-compose da stack
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ app_base_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"

- name: Subir stack de aplicações
  community.docker.docker_compose_v2:
    project_src: "{{ app_base_dir }}"
    state: present
