- name: Atualizar cache apt
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Instalar pacotes base
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - python3-pip
      - docker.io
      - docker-compose-plugin
    state: present

- name: Habilitar e iniciar Docker
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started
