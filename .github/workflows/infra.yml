name: Infra Azure + Ansible

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Executar terraform apply"
        required: true
        default: "false"

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    outputs:
      public_ip: ${{ steps.outputs_tf.outputs.public_ip }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Validate required secrets
        shell: bash
        env:
          TF_VAR_ADMIN_SSH_PUBLIC_KEY: ${{ secrets.TF_VAR_admin_ssh_public_key }}
        run: |
          if [ -z "${TF_VAR_ADMIN_SSH_PUBLIC_KEY// }" ]; then
            echo "❌ Secret TF_VAR_admin_ssh_public_key está vazio ou não configurado." >&2
            exit 1
          fi
          if ! echo "$TF_VAR_ADMIN_SSH_PUBLIC_KEY" | grep -Eq '^ssh-(rsa|ed25519) '; then
            echo "❌ TF_VAR_admin_ssh_public_key inválido. Use a chave pública completa (ex: ssh-rsa ...)." >&2
            exit 1
          fi

      - name: Terraform Init
        working-directory: terraform
        env:
          TF_VAR_admin_ssh_public_key: ${{ secrets.TF_VAR_admin_ssh_public_key }}
        run: terraform init

      - name: Terraform Fmt
        working-directory: terraform
        run: terraform fmt -check

      - name: Terraform Validate
        working-directory: terraform
        env:
          TF_VAR_admin_ssh_public_key: ${{ secrets.TF_VAR_admin_ssh_public_key }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform
        env:
          TF_VAR_admin_ssh_public_key: ${{ secrets.TF_VAR_admin_ssh_public_key }}
        run: terraform plan -out tfplan

      - name: Terraform Apply
        if: ${{ github.event.inputs.apply == 'true' }}
        working-directory: terraform
        env:
          TF_VAR_admin_ssh_public_key: ${{ secrets.TF_VAR_admin_ssh_public_key }}
        run: terraform apply -auto-approve tfplan

      - name: Export Terraform Outputs
        id: outputs_tf
        if: ${{ github.event.inputs.apply == 'true' }}
        working-directory: terraform
        run: |
          echo "public_ip=$(terraform output -raw public_ip_address)" >> "$GITHUB_OUTPUT"

  ansible:
    runs-on: ubuntu-latest
    needs: terraform
    if: ${{ github.event.inputs.apply == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Write SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Build inventory
        run: |
          mkdir -p ansible/inventory
          cat > ansible/inventory/hosts.ini <<INVENTORY
          [app]
          vm ansible_host=${{ needs.terraform.outputs.public_ip }} ansible_user=azureuser ansible_ssh_private_key_file=~/.ssh/id_rsa
          INVENTORY

      - name: Run playbook
        run: ansible-playbook -i ansible/inventory/hosts.ini ansible/playbooks/site.yml
